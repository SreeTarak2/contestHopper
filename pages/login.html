<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contest Hopper - Authentication</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Quicksand:wght@500;700&family=Russo+One&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./styles/login.css">
</head>

<body>

    <div class="auth-container">
        <div class="auth-header">
            <a href="#" class="logo-text">Contest<span>Hopper</span></a>
        </div>

        <div class="auth-toggle">
            <div id="slider-indicator"></div>
            <button class="toggle-btn active" id="login-toggle-btn" data-form="login-form">Login</button>
            <button class="toggle-btn" id="signup-toggle-btn" data-form="signup-form">Sign Up</button>
        </div>

        <div class="form-slider" id="form-slider">
            <!-- Login Form -->
            <form id="login-form">
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" class="input-field" placeholder="Email" name = "email" required autocomplete="email">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" class="input-field" placeholder="Password" name="password" required
                        autocomplete="current-password">
                </div>
                <div class="form-options">
                    <div></div>
                    <a href="#">Forgot Password?</a>
                </div>
                <button type="submit" class="auth-button">Login</button>
                <div class="form-message" id="login-message"></div>
                <div class="divider">or continue with</div>
                <div class="social-auth">
                    <a href="#" class="social-btn google"><img
                            src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google icon"></i></a>
                    <a href="#" class="social-btn github"><i class="fab fa-github"></i></a>
                    <a href="#" class="social-btn linkedin"><i class="fab fa-linkedin-in"></i></a>
                </div>
            </form>

            <!-- Sign Up Form -->
            <form id="signup-form">
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" class="input-field" name="username"placeholder="Username" required autocomplete="username">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" class="input-field" name="email" placeholder="Email" required autocomplete="email">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" class="input-field" name="password" placeholder="Create Password" required
                        autocomplete="new-password">
                </div>
                <button type="submit" class="auth-button">Create Account</button>
                <div class="form-message" id="signup-message"></div>
                <div class="divider">or sign up with</div>
                <div class="social-auth">
                    <a href="#" class="social-btn google"><img
                            src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google icon"></i></a>
                    <a href="#" class="social-btn github"><i class="fab fa-github"></i></a>
                    <a href="#" class="social-btn linkedin"><i class="fab fa-linkedin-in"></i></a>
                </div>
            </form>
        </div>
    </div>

    <script src="./js/registration.js"></script>
</body>

</html>
