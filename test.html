<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Section with Lenis</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* ======================================================= */
    /*      ENHANCED & RESPONSIVE HERO SECTION (MOBILE-FIRST)  */
    /* ======================================================= */

    .hero-section {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      /* RESPONSIVE: Start with mobile-friendly padding */
      padding: 4rem 1.5rem 2rem;
      color: #fff;
    }

    /* --- Background Image & Overlay --- */
    .hero-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Add a dark overlay for text readability */
    .hero-background::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.2));
    }

    .hero-background img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      /* GSAP will control opacity */
      opacity: 1;
    }

    /* --- Main Content Layout --- */
    .hero-content-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1400px;
      display: flex;
      /* RESPONSIVE: Stack text and slider on mobile by default */
      flex-direction: column;
      gap: 2rem;
      align-items: center;
      text-align: center;
    }

    /* --- Hero Text Styling --- */
    .hero-text {
      max-width: 600px;
      /* GSAP will control opacity */
      opacity: 1;
    }

    .contest-title {
      font-family: "Syncopate", sans-serif;
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-weight: 700;
      line-height: 1.1;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
    }

    .contest-subtitle {
      font-family: "Quicksand", sans-serif;
      font-size: clamp(1rem, 2.5vw, 1.1rem);
      line-height: 1.6;
      margin-top: 1rem;
      opacity: 0.9;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
    }

    .hero-button {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background-color: transparent;
      color: var(--accent-glow, #00f0ff);
      border: 2px solid var(--accent-glow, #00f0ff);
      padding: 0.8rem 2rem;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
      margin-top: 1.5rem;
      transition: all 0.3s ease;
    }

    .hero-button:hover {
      background-color: var(--accent-glow, #00f0ff);
      color: #0d0d0d;
      box-shadow: 0 5px 20px rgba(0, 240, 255, 0.3);
      transform: translateY(-3px);
    }

    /* --- Splide Slider Styling --- */
    .splide {
      width: 100%;
      padding: 1rem 0;
    }

    .splide__slide {
      height: 200px;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      border: 3px solid transparent;
      /* RESPONSIVE: Inactive slides are less prominent */
      opacity: 0.6;
      transform: scale(0.9);
      transition: opacity 0.4s ease, transform 0.4s ease, border-color 0.4s ease;
    }

    .splide__slide.is-active {
      /* RESPONSIVE: Active slide is larger and fully opaque */
      opacity: 1;
      transform: scale(1);
      border-color: var(--accent-glow, #00f0ff);
    }

    .splide__slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .mini-card-details {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 2rem 1rem 1rem;
      color: white;
      font-family: "Syncopate", sans-serif;
      font-weight: 700;
      font-size: 1rem;
      text-align: center;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
      transition: opacity 0.3s ease;
    }

    /* Hide Splide's default arrows, as we rely on drag/click */
    .splide__arrows {
      display: none;
    }

    /* Style Splide's pagination dots */
    .splide__pagination__page {
      background: rgba(255, 255, 255, 0.5);
      width: 10px;
      height: 10px;
      margin: 0 5px;
    }

    .splide__pagination__page.is-active {
      background: #fff;
      transform: scale(1.2);
    }


    /* =================================================================== */
    /* ==   DESKTOP STYLES : Adjustments for screens 992px and wider    == */
    /* =================================================================== */
    @media (min-width: 992px) {
      .hero-section {
        padding: var(--header-height, 80px) 2rem 2rem;
      }

      .hero-content-wrapper {
        /* RESPONSIVE: Side-by-side layout on desktop */
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-end;
        /* Align to the bottom for a classic look */
        text-align: left;
      }

      .hero-text {
        flex: 1;
        max-width: 50%;
        margin-bottom: 2rem;
      }

      .splide {
        flex: 1;
        max-width: 45%;
        /* Override mobile width */
        width: auto;
      }

      .splide__slide {
        height: 250px;
      }
    }

    /* ============================================= */
    /* == Enhanced Preloader Style == */
    /* ============================================= */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0d0d0d 0%, #1a1a2e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.7s ease-out;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-container {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loader-core {
      width: 40px;
      height: 40px;
      background: var(--accent-glow, #00ff88);
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
      box-shadow: 0 0 20px var(--accent-glow, #00ff88), 0 0 40px rgba(0, 255, 136, 0.5);
    }

    .loader-orbit {
      position: absolute;
      border: 2px solid transparent;
      border-top: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      animation: spin 2s linear infinite;
    }

    .loader-orbit.orbit-1 {
      width: 80px;
      height: 80px;
      animation-duration: 1.2s;
    }

    .loader-orbit.orbit-2 {
      width: 100px;
      height: 100px;
      animation-duration: 1.8s;
      animation-direction: reverse;
    }

    .loader-text {
      position: absolute;
      bottom: -40px;
      color: #ffffff;
      font-family: 'Arial', sans-serif;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      animation: fadeInOut 2s ease-in-out infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 0.8;
      }

      50% {
        transform: scale(1.2);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 0.8;
      }
    }

    @keyframes fadeInOut {

      0%,
      100% {
        opacity: 0.5;
      }

      50% {
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loader-container">
      <div class="loader-core"></div>
      <div class="loader-orbit orbit-1"></div>
      <div class="loader-orbit orbit-2"></div>
      <div class="loader-text">Hopping into Contests...</div>
    </div>
  </div>
  <!-- ============================================= -->
  <!-- ==         ENHANCED HERO SECTION           == -->
  <!-- ============================================= -->
  <section class="hero-section">
    <div class="hero-background">
      <!-- The background image will be controlled by JavaScript -->
      <img id="heroImage" src="../assets/Images/AI&VR/herosectionimg.webp" alt="Hero background" />
    </div>

    <div class="hero-content-wrapper">
      <div class="hero-text">
        <h2 class="contest-title" id="heroTitle">Contests</h2>
        <h5 class="contest-subtitle" id="heroDescription">An immersive AI & VR hackathon pushing the boundaries of
          innovation.</h5>
        <a href="#" class="hero-button" id="heroLink">
          <span>Apply Now</span>
          <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>

      <!-- Splide.js Slider Structure -->
      <div id="hero-slider" class="splide">
        <div class="splide__track">
          <ul class="splide__list">
            <!-- Slide 1 -->
            <li class="splide__slide" data-bg="../assets/Images/AI&VR/herosectionimg.webp" data-title="Codefest"
              data-description="An immersive AI & VR hackathon pushing the boundaries of innovation."
              data-link="/codefest-details">
              <img src="../assets/Images/AI&VR/herosectionimg.webp" alt="Tech Contest">
              <div class="mini-card-details">Codefest</div>
            </li>
            <!-- Slide 2 -->
            <li class="splide__slide"
              data-bg="../assets/Images/Cyberpunk/Made_with_insMind-Made_with_insMind-6566e387-c23a-43b2-805f-b4de6d8b9658.webp"
              data-title="RETRO JAM" data-description="A thrilling retro gaming contest inspired by the cyberpunk era."
              data-link="/retro-jam-details">
              <img
                src="../assets/Images/Cyberpunk/Made_with_insMind-Made_with_insMind-6566e387-c23a-43b2-805f-b4de6d8b9658.webp"
                alt="Retro Gaming Contest">
              <div class="mini-card-details">RETRO JAM</div>
            </li>
            <!-- Slide 3 -->
            <li class="splide__slide" data-bg="../assets/Images/Droughts/freepik__expand__11770.png"
              data-title="DESIGN DUEL" data-description="Compete in a fast-paced UI/UX challenge to design for impact."
              data-link="/design-duel-details">
              <img src="../assets/Images/Droughts/freepik__expand__11770.png" alt="UI/UX Design Contest">
              <div class="mini-card-details">DESIGN DUEL</div>
            </li>
            <!-- Slide 4 -->
            <li class="splide__slide" data-bg="../assets/Images/Hackathons/freepik__expand__84176 (1).png"
              data-title="INNO PITCH" data-description="Pitch your startup ideas to top VCs and tech mentors."
              data-link="/inno-pitch-details">
              <img src="../assets/Images/Hackathons/freepik__expand__84176 (1).png" alt="Startup Pitch Contest">
              <div class="mini-card-details">INNO PITCH</div>
            </li>
            <!-- Slide 5 -->
            <li class="splide__slide" data-bg="../assets/Images/Plants/freepik__expand__92815 (1).png"
              data-title="MARKET MAVEN"
              data-description="Showcase your marketing brilliance through real-world strategy challenges."
              data-link="/market-maven-details">
              <img src="../assets/Images/Plants/freepik__expand__92815 (1).png" alt="Marketing Contest">
              <div class="mini-card-details">MARKET MAVEN</div>
            </li>
          </ul>
        </div>
        <!-- Optional: You can style Splide's default arrows or create your own -->
      </div>
    </div>
  </section>
  <!-- GSAP Core Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Splide.js Library -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {

      const loadingOverlay = document.getElementById('loadingOverlay');

      // Hide loader after 3 seconds or when content is fully loaded
      window.addEventListener('load', () => {
        setTimeout(() => {
          loadingOverlay.classList.add('hidden');
          // Remove from DOM after transition to prevent interaction
          setTimeout(() => {
            loadingOverlay.style.display = 'none';
          }, 700); // Match transition duration
        }, 2000); // Minimum display time for effect
      });
      const heroSlider = document.getElementById('hero-slider');
      const heroImage = document.getElementById('heroImage');
      const heroTitle = document.getElementById('heroTitle');
      const heroDescription = document.getElementById('heroDescription');
      const heroLink = document.getElementById('heroLink');

      if (!heroSlider || !heroImage || !heroTitle || !heroDescription || !heroLink) {
        console.error("Hero section components are missing. Aborting script.");
        return;
      }

      // Initialize Splide with pagination disabled
      const splide = new Splide('#hero-slider', {
        type: 'loop',
        perPage: 3,
        perMove: 1,
        focus: 'center',
        gap: '0.8rem',
        autoplay: true,
        interval: 4000,
        pauseOnHover: true,
        pagination: false, // Disable default pagination
        arrows: false,
        breakpoints: {
          992: { perPage: 2 },
          640: { perPage: 1, gap: '0.5rem' },
        },
      }).mount();

      // Custom navigation buttons
      const navButtons = document.querySelectorAll('.nav-button');
      navButtons.forEach((button, index) => {
        button.addEventListener('click', () => {
          splide.go(index); // Go to the slide corresponding to the button
          navButtons.forEach((btn) => btn.classList.remove('active'));
          button.classList.add('active');
        });
      });

      // Update active button on slide change
      splide.on('active', (slide) => {
        updateHeroContent(slide.slide);
        navButtons.forEach((btn) => btn.classList.remove('active'));
        navButtons[slide.index].classList.add('active');
      });

      // GSAP updateHeroContent function (unchanged)
      function updateHeroContent(activeSlide) {
        const bg = activeSlide.dataset.bg;
        const title = activeSlide.dataset.title;
        const description = activeSlide.dataset.description;
        const link = activeSlide.dataset.link;

        const tl = gsap.timeline();
        tl.to([heroTitle, heroDescription, heroLink, heroImage], {
          opacity: 0,
          duration: 0.3,
          ease: 'back2.in',
        });
        tl.call(() => {
          heroTitle.textContent = title;
          heroDescription.textContent = description;
          heroLink.href = link;
          heroImage.src = bg;
        });
        tl.to([heroTitle, heroDescription, heroLink, heroImage], {
          opacity: 1,
          duration: 0.6,
          ease: 'back2.out',
        });
      }

      // Initialize first slide and button
      const firstSlide = document.querySelector('#hero-slider .splide__slide');
      if (firstSlide) {
        updateHeroContent(firstSlide);
        navButtons[0].classList.add('active');
      }
    });
  </script>
</body>

</html>
