<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Touch Events Slider</title>
    <style>
        /* Basic styles for the slider */
        #sliderWrapper {
            display: flex;
            overflow: hidden;
            width: 100%;
            height: 300px; /* Set a height for the slider */
            background-color: lightgray;
            transition: transform 0.5s ease;
        }
        .mini-card {
            flex: 0 0 100%; /* Ensure each card takes full width */
            height: 100%;
            background-color: #fff;
            border: 1px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #ccc;
            border-radius: 50%;
            margin: 0 5px;
            cursor: pointer;
        }
        .dot.active {
            background-color: #333;
        }
    </style>
</head>
<body>

    <div id="loadingOverlay">Loading...</div>
    <div class="hero-section">
        <div id="sliderWrapper">
            <div class="mini-card">Card 1</div>
            <div class="mini-card">Card 2</div>
            <div class="mini-card">Card 3</div>
        </div>
    </div>
    <div id="pagination-dots"></div>

    <script>
        window.addEventListener("load", () => {
            const loadingOverlay = document.getElementById("loadingOverlay");
            if (loadingOverlay) {
                setTimeout(() => {
                    loadingOverlay.classList.add("hidden");
                    document.body.style.overflow = "auto";
                }, 500);
            }

            const sliderWrapper = document.getElementById("sliderWrapper");
            const dotsContainer = document.getElementById("pagination-dots");

            if (!sliderWrapper) {
                console.error("Slider wrapper is missing in the DOM.");
                return;
            }

            const cards = Array.from(document.querySelectorAll(".mini-card"));
            let currentIndex = 0;
            let isTransitioning = false;
            let touchStartX = 0;

            function goToSlide(newIndex) {
                if (isTransitioning) return;
                isTransitioning = true;

                currentIndex = (newIndex + cards.length) % cards.length;
                const activeCard = cards[currentIndex];

                cards.forEach((card) => card.classList.remove("active"));
                activeCard.classList.add("active");

                document.querySelectorAll(".dot").forEach((dot, i) => {
                    dot.classList.toggle("active", i === currentIndex);
                });

                const cardWidth = cards[0].offsetWidth;
                const gap = parseInt(getComputedStyle(sliderWrapper).gap || "0");
                const offset = -currentIndex * (cardWidth + gap);
                sliderWrapper.style.transform = `translateX(${offset}px)`;

                setTimeout(() => {
                    isTransitioning = false;
                }, 500);
            }

            function initSlider() {
                dotsContainer.innerHTML = "";
                cards.forEach((_, i) => {
                    const dot = document.createElement("span");
                    dot.classList.add("dot");
                    dot.addEventListener("click", () => {
                        goToSlide(i);
                    });
                    dotsContainer.appendChild(dot);
                });

                goToSlide(0);
            }

            if ("ontouchstart" in window || navigator.maxTouchPoints > 0 || navigator.msMaxTouchPoints > 0) {
                sliderWrapper.addEventListener("touchstart", (e) => {
                    touchStartX = e.changedTouches[0].screenX;
                    console.log("Touch start detected:", touchStartX);
                    e.preventDefault(); // Prevents the default behavior, like scrolling
                }, { passive: false });

                sliderWrapper.addEventListener("touchend", (e) => {
                    const touchEndX = e.changedTouches[0].screenX;
                    const diff = touchStartX - touchEndX;

                    console.log("Touch end detected:", touchEndX);
                    console.log("Swipe diff:", diff);

                    if (Math.abs(diff) > 50) {
                        console.log("Swipe detected. Navigating slide.");
                        goToSlide(diff > 0 ? currentIndex + 1 : currentIndex - 1);
                    } else {
                        console.log("Swipe too small, no slide change.");
                    }
                });
            }

            initSlider();
        });
    </script>
</body>
</html>
